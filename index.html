---
layout: default
title: "Real-time Threat Intel Dashboard"
---

<style>
  /* 이전의 터미널 스타일 유지 */
  :root { --bg-color: #0a0a0a; --text-primary: #00ff00; --text-secondary: #008800; --border-color: #333; }
  body { background-color: var(--bg-color); color: var(--text-primary); font-family: 'Courier New', monospace; padding: 20px; }
  .terminal-container { max-width: 900px; margin: 0 auto; border: 1px solid var(--border-color); background: #050505; }
  .terminal-header { background: var(--border-color); color: #fff; padding: 10px; display: flex; justify-content: space-between; font-size: 0.8em; }
  .terminal-body { padding: 30px; }
  .post-item { border-left: 3px solid var(--text-secondary); padding: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; transition: 0.3s; }
  .post-item:hover { background: #111; border-left-color: var(--text-primary); cursor: pointer; }
  .post-link { color: var(--text-primary); text-decoration: none; font-weight: bold; }
  .status-tag { color: #ff0000; border: 1px solid #ff0000; padding: 2px 5px; font-size: 0.7em; }
</style>

<div class="terminal-container">
  <div class="terminal-header">
    <span>SYSTEM@SEC-OPS:~/LIVE_REPORTS</span>
    <span id="clock"></span>
  </div>
  <div class="terminal-body">
    <div style="margin-bottom: 20px;">
      <h2>> LIVE_STORAGE_SCANNING...</h2>
      <p id="loading-msg">[WAIT] Accessing GitHub Repository API...</p>
    </div>

    <div id="file-list"></div>
  </div>
</div>

<script>
  // 1. 설정 정보 (사용자님의 환경에 맞게 자동 세팅)
  const OWNER = "putto4u"; 
  const REPO = "06.Hacking-Response.inCloud";
  const TARGET_FOLDER = ""; // 루트 폴더의 파일을 보여주려면 비워두세요.

  async function fetchRepoFiles() {
    const listContainer = document.getElementById('file-list');
    const loadingMsg = document.getElementById('loading-msg');

    try {
      // 2. GitHub REST API 호출 (실시간 파일 목록 가져오기)
      const response = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${TARGET_FOLDER}`);
      const files = await response.json();

      loadingMsg.innerText = `[OK] ${files.length} Files Discovered in Repository.`;
      
      let htmlContent = "";
      files.forEach(file => {
        // .html, .md 파일이면서 index.html 등 시스템 파일 제외
        if ((file.name.endsWith('.md') || file.name.endsWith('.html')) && file.name !== 'index.html' && file.name !== 'README.md') {
          htmlContent += `
            <div class="post-item" onclick="location.href='${file.html_url}'">
              <div>
                <span style="color:var(--text-secondary)"># FILE_ID:</span> 
                <a class="post-link" href="${file.path}">${file.name}</a>
              </div>
              <span class="status-tag">LIVE_DATA</span>
            </div>`;
        }
      });
      listContainer.innerHTML = htmlContent;
    } catch (error) {
      loadingMsg.innerText = "[ERROR] API Connection Failed.";
      console.error(error);
    }
  }

  // 실시간 시계 기능
  setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleString(); }, 1000);
  
  // 실행
  fetchRepoFiles();
</script>
