            <h1>Web APP & API Protection (WAAP) 및 SSL/TLS 가시성 확보 전략</h1>
        </header>

        <p>
            현대 엔터프라이즈 환경에서 웹 서비스는 단순한 콘텐츠 전달을 넘어, 수많은 <span class="term">API (Application Programming Interface, 애플리케이션 프로그래밍 인터페이스)</span> 통신을 기반으로 작동합니다. 
            본 섹션에서는 지능화된 웹 공격과 암호화 트래픽 속에 숨겨진 위협을 효과적으로 탐지하고 차단하기 위한 차세대 보안 아키텍처를 학습합니다.
        </p>

        <section>
            <h2>WAAP (Web Application and API Protection, 웹 애플리케이션 및 API 보호)</h2>
            <p>
                전통적인 <span class="term">WAF (Web Application Firewall, 웹 방화벽)</span>이 시그니처 기반의 정적 방어에 집중했다면, 
                <span class="term">WAAP (Web Application and API Protection, 웹 애플리케이션 및 API 보호)</span>는 API 보안, 지능형 봇 관리, 
                <span class="term">DDoS (Distributed Denial of Service, 분산 서비스 거부 공격)</span> 방어를 통합한 모델입니다.
            </p>

            <div class="diagram-box">
                <svg width="500" height="180" viewBox="0 0 500 180">
                    <rect x="200" y="40" width="100" height="100" rx="8" fill="#e7f3ff" stroke="#27348b" stroke-width="2"/>

                    <path d="M50 90 L180 90" stroke="#ff4d4d" stroke-width="2" marker-end="url(#arrow-red)"/>
                    <path d="M320 90 L450 90" stroke="#28a745" stroke-width="2" marker-end="url(#arrow-green)"/>
                    <text x="60" y="80" fill="#ff4d4d" font-size="12">Untrusted Traffic</text>
                    <text x="350" y="80" fill="#28a745" font-size="12">Clean Traffic</text>

                    </defs>
                </svg>
                <span class="diagram-caption">[도식 1-1] WAAP 엔진을 통한 트래픽 정화 및 API 보호 아키텍처</span>
            </div>

            <h3>핵심 기술 요소 (Core Components)</h3>
            <ul>
                <li><span class="step-number">1</span> <b>AI 기반 자율 탐지:</b> <span class="term">AI (Artificial Intelligence, 인공지능)</span>를 활용하여 정상 트래픽 패턴을 학습하고, <span class="tech-tag">SQL Injection</span> 및 <span class="tech-tag">XSS</span> 공격을 자동 차단합니다.</li>
                <li><span class="step-number">2</span> <b>API 보안 최적화:</b> <span class="tech-tag">BOLA (Broken Object Level Authorization, 손상된 객체 수준 권한 부여)</span>와 같은 논리적 취약점을 정교하게 탐지합니다.</li>
                <li><span class="step-number">3</span> <b>봇 매니지먼트:</b> 정상적인 검색 엔진 봇과 악의적인 스크래핑/크리덴셜 스터핑 봇을 구분하여 제어합니다.</li>
            </ul>

            <div class="callout note">
                <span class="callout-title">[보충 설명: 보안 아키텍트의 Insight]</span>
                WAAP 도입 시 가장 중요한 것은 <b>'Positive Security Model(긍정 보안 모델)'</b>의 수립입니다. 
                단순히 '공격 리스트'를 막는 것이 아니라, <span class="term">Swagger</span>나 <span class="term">OpenAPI Specification (오픈 API 사양)</span> 정의서를 기반으로 
                '허용된 정상 요청'만 통과시키는 화이트리스트 기반 방어 체계를 구축할 때 API 보안의 실효성이 확보됩니다.
            </div>

            <div class="callout warning">
                <span class="callout-title">[AWS 유료 서비스 과금 주의]</span>
                <b>AWS WAF</b>는 Web ACL 당 월 $5.00의 기본료와 100만 요청당 $0.60의 처리 비용이 발생합니다. 
                특히 <b>AWS Shield Advanced</b>는 대규모 인프라 보호를 위해 필수적이나 월 $3,000의 높은 구독료가 발생하므로 ROI(투자 대비 효과) 분석이 선행되어야 합니다.
            </div>
        </section>

        <section>
            <h2>SSL/TLS Inspection (암호화 트래픽 가시성 확보)</h2>
            <p>
                트래픽의 암호화는 보안을 강화하지만, 동시에 보안 장비가 악성 코드를 검사하지 못하게 하는 가시성 단절 문제를 야기합니다. 
                <span class="term">SSL (Secure Sockets Layer, 보안 소켓 계층)</span> 및 <span class="term">TLS (Transport Layer Security, 전송 계층 보안)</span> 1.3 환경에서의 복호화 전략이 필요합니다.
            </p>

            <div class="diagram-box">
                <svg width="500" height="150" viewBox="0 0 500 150">
                    <rect x="50" y="50" width="80" height="50" rx="4" fill="#f1f3f5" stroke="#ced4da"/>

                    <rect x="370" y="50" width="80" height="50" rx="4" fill="#f1f3f5" stroke="#ced4da"/>
                    <text x="215" y="75" fill="#f0ad4e" font-size="12" font-weight="700">TLS Proxy</text>
                    <text x="215" y="95" fill="#d73a49" font-size="10">Decryption</text>
                    <path d="M130 75 L190 75" stroke="#27348b" stroke-width="2" stroke-dasharray="4"/>
                    <path d="M310 75 L360 75" stroke="#27348b" stroke-width="2"/>
                    <text x="145" y="65" fill="#27348b" font-size="10">Encrypted</text>
                </svg>
                <span class="diagram-caption">[도식 1-2] 인라인 복호화 프록시를 통한 가시성 확보 및 재암호화 프로세스</span>
            </div>

            <h3>현대적 위협 대응 기술</h3>
            <ul>
                <li><b>ECH (Encrypted Client Hello) 대응:</b> <span class="term">SNI (Server Name Indication, 서버 이름 표시)</span> 암호화에 대비한 복호화 게이트웨이 전략 수립.</li>
                <li><b>PQC (Post-Quantum Cryptography, 양자 내성 암호):</b> <span class="tech-tag">ML-KEM</span> 등 차세대 암호 알고리즘 지원 여부 검토.</li>
            </ul>

            <div class="callout note">
                <span class="callout-title">[보충 설명: 개인정보 보호와 가시성]</span>
                복호화 검사 시 반드시 <b>'Privacy Bypass(프라이버시 예외 처리)'</b> 목록을 정의해야 합니다. 
                유럽의 <span class="term">GDPR (General Data Protection Regulation, 일반 데이터 보호 규정)</span> 및 국내 개인정보보호법 준수를 위해 
                금융, 의료, 공공 등 민감 정보가 송수신되는 도메인은 복호화 대상에서 제외하여 법적 리스크를 원천 차단하십시오.
            </div>
        </section>
